name: Update ECB + crypto rates

on:
  workflow_dispatch:
  schedule:
    # ECB publishes around 14:10 CET/CEST on publication days.
    # 14:30 UTC is safely after that year-round.
    - cron: "30 14 * * *"

permissions:
  contents: write

concurrency:
  group: daily-rates-update
  cancel-in-progress: false

jobs:
  update-rates:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate full historical snapshot
        env:
          # Optional but strongly recommended.
          # Add a GitHub Actions secret named CMC_API_KEY to use CoinMarketCap's
          # official API. If absent, rates.py uses a conservative public-site
          # fallback and writes ERROR when it detects blocking/failure.
          CMC_API_KEY: ${{ secrets.CMC_API_KEY }}
        run: python rates.py

      - name: Commit dated snapshot
        run: |
          git config user.name "rates-bot"
          git config user.email "rates-bot@users.noreply.github.com"
          git add output/
          if git diff --cached --quiet; then
            echo "No output changes."
            exit 0
          fi
          git commit -m "Update exchange rates $(date -u +%Y-%m-%d)"
          git push
